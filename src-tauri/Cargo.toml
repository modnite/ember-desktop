[package]
name = "ember-desktop"
version = "0.5.4"
description = "Ember for the desktop"
edition = "2021"

[lib]
name = "ember_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }

# Linux: the webview itself (the same version Tauri uses), to switch on camera, microphone and WebRTC, which WebKitGTK leaves off.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
