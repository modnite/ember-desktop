<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember</title>
<style>
  :root { --bg: #fffbf8; --on-bg: #1b1411; --muted: #6b5a53; --primary: #e8590c; --on-primary: #fff; --outline: #85736c; --error: #ba1a1a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17110e; --on-bg: #f1dfd8; --muted: #b8a49c; --primary: #ff8a50; --on-primary: #3a1400; --outline: #9d8c84; --error: #ffb4ab; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--on-bg); font: 16px/1.4 "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; }
  main { width: min(360px, calc(100% - 48px)); text-align: center; }
  svg { width: 96px; height: 96px; fill: var(--primary); display: block; margin: 0 auto 4px; }
  h1 { margin: 0 0 4px; font-size: 32px; color: var(--primary); }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  label { display: block; text-align: left; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  input { width: 100%; height: 52px; padding: 0 16px; border: 1.5px solid var(--outline); border-radius: 16px; background: transparent; color: var(--on-bg); font: inherit; }
  input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  button { width: 100%; height: 52px; margin-top: 16px; border: 0; border-radius: 26px; background: var(--primary); color: var(--on-primary); font: 600 16px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
  button[disabled] { opacity: 0.55; cursor: default; }
  button.text { background: none; color: var(--primary); height: 44px; margin-top: 8px; }
  .error { color: var(--error); margin: 12px 0 0; min-height: 1.4em; font-size: 14px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M8,3 H16 A5,5 0 0 1 21,8 V11 A5,5 0 0 1 16,16 H13 L7,20.5 L8,16 A5,5 0 0 1 3,11 V8 A5,5 0 0 1 8,3 Z M12,5.8 C12,5.8 9.3,8.3 9.3,10.6 C9.3,12.1 10.5,13.2 12,13.2 C13.5,13.2 14.7,12.1 14.7,10.6 C14.7,9.4 14.1,8.5 13.4,7.8 C13.4,8.8 12.9,9.3 12.4,9.3 C12.7,8.2 12.4,6.9 12,5.8 Z"/></svg>
  <h1>Ember</h1>
  <p class="sub">Private messaging on your own server.</p>
  <form id="form" novalidate>
    <label for="server">Server</label>
    <input id="server" type="text" placeholder="ember.example.com" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    <p class="error" id="error" role="alert"></p>
    <button id="go" type="submit">Connect</button>
    <button id="cancel" class="text" type="button" hidden>Cancel</button>
  </form>
</main>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const input = document.getElementById('server');
  const error = document.getElementById('error');
  const go = document.getElementById('go');
  const cancel = document.getElementById('cancel');
  invoke('window_ready').catch(() => {});
  // With a server already chosen this page was opened to change it, so there is a way back.
  invoke('get_server').then((s) => { if (s) { input.value = s.replace(/^https:\/\//, ''); cancel.hidden = false; } }).catch(() => {});
  cancel.addEventListener('click', () => { invoke('return_to_server').catch(() => {}); });
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    error.textContent = '';
    go.disabled = true;
    go.textContent = 'Connecting…';
    try {
      await invoke('set_server', { input: input.value });
    } catch (err) {
      error.textContent = typeof err === 'string' ? err : 'That did not work.';
      go.disabled = false;
      go.textContent = 'Connect';
    }
  });
</script>
</body>
</html>
