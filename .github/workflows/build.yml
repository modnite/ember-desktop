name: build

# Builds the Ember desktop installers on Windows, macOS and Linux and attaches them to a release.
# Run it from the Actions tab (or with `gh workflow run build.yml -f tag=v0.4.3`) once the release for that tag exists.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installers to (for example v0.4.3)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS (Apple silicon and Intel)
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb,appimage
            files: src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npx tauri build ${{ matrix.args }}
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ matrix.files }}
        run: |
          for f in $FILES; do
            echo "uploading $f"
            gh release upload "${{ inputs.tag }}" "$f" --clobber
          done
